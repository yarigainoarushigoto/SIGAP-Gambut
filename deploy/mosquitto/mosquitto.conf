# Mosquitto 2.x untuk SIGAP-Gambut
persistence true
persistence_location /mosquitto/data/

# MQTT biasa — dipakai penerima LoRa (ESP32) dan backend
listener 1883
protocol mqtt

# MQTT over WebSocket — dipakai dashboard di browser untuk pembaruan instan.
# Di produksi, taruh di belakang reverse proxy TLS (wss://) karena dashboard HTTPS tidak boleh memanggil ws://.
listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd
